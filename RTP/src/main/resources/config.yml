rtp:

  # Минимальное расстояние от центра мира
  min-radius: 500

  # Максимальное расстояние от центра мира
  max-radius: 5000

  # Сколько попыток найти безопасное место
  attempts: 20

  # Задержка перед телепортацией
  # 0 = мгновенно
  teleport-delay: 5

  # Cooldown между RTP
  # В секундах
  cooldown: 60

  # Миры, в которых разрешён RTP
  worlds:
    - world


messages:

  prefix: "§6[RTP] §r"

  searching: "§eИщем безопасное место..."

  countdown: "§eТелепортация через §f{seconds}§e сек. Не двигайтесь!"

  success: "§aВы были телепортированы в случайное место!"

  cancelled: "§cТелепортация отменена — вы двинулись."

  cooldown: "§cRTP будет доступен через §f{seconds}§c сек."

  already-teleporting: "§cТелепортация уже выполняется."

  no-location: "§cНе удалось найти безопасное место. Попробуйте ещё раз."

  world-disabled: "§cRTP недоступен в этом мире."

  player-only: "§cЭта команда доступна только игрокам."

  no-permission: "§cУ вас нет разрешения."

  reloaded: "§aКонфигурация RTP перезагружена."